name: False positive / 误报
description: Report a finding that should not have been emitted.
title: "[False positive] "
labels: ["false-positive"]
body:
  - type: input
    id: version
    attributes: {label: Version, placeholder: v0.2.0-beta}
    validations: {required: true}
  - type: input
    id: rule
    attributes: {label: Finding or rule ID}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Redacted evidence, description: Remove usernames, absolute paths, credentials, bundle IDs, and private project names.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected result and reasoning}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal, project, credential, and proprietary information.
          required: true
