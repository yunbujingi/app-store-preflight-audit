name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run dependency-free tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python helpers
        run: python3 -m compileall -q skill/app-store-preflight-audit/scripts tests
      - name: Run reproducible eval gate
        run: |
          python3 skill/app-store-preflight-audit/scripts/run_evals.py \
            --cases evals/cases.json --output /tmp/app-store-preflight-evals.json
      - name: Validate target graph and policy registry
        run: |
          python3 skill/app-store-preflight-audit/scripts/inspect_target_graph.py \
            --root evals/fixtures/multi-target --project Sample.xcodeproj \
            --metadata-dir evals/fixtures/multi-target/metadata \
            --configuration Release --output /tmp/app-store-preflight-target-graph.json
          python3 skill/app-store-preflight-audit/scripts/validate_rule_registry.py \
            --registry skill/app-store-preflight-audit/references/policy-registry.json \
            --output /tmp/app-store-preflight-policy-registry.json
      - name: Verify deterministic package
        run: |
          mkdir -p dist
          python3 skill/app-store-preflight-audit/scripts/package_skill.py \
            --skill skill/app-store-preflight-audit \
            --output dist/app-store-preflight-audit.zip \
            --checksum-output dist/app-store-preflight-audit.zip.sha256 \
            --provenance-output dist/app-store-preflight-audit.provenance.json
          python3 skill/app-store-preflight-audit/scripts/package_skill.py \
            --skill skill/app-store-preflight-audit \
            --output /tmp/app-store-preflight-audit-second.zip
          cmp dist/app-store-preflight-audit.zip /tmp/app-store-preflight-audit-second.zip
      - name: Build and smoke-test scanner wheel
        run: |
          python3 -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
          python3 -m venv /tmp/app-store-preflight-wheel-test
          /tmp/app-store-preflight-wheel-test/bin/pip install --no-index dist/app_store_preflight_audit-*.whl
          /tmp/app-store-preflight-wheel-test/bin/app-store-preflight-audit --version
          /tmp/app-store-preflight-wheel-test/bin/app-store-preflight-audit asc-read \
            --endpoint apps --fixture evals/fixtures/asc-api/apps.json \
            --output /tmp/app-store-preflight-asc-read.json
      - name: Check scaffold placeholders
        run: '! grep -R "\[TODO" skill/app-store-preflight-audit'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-store-preflight-audit-skill
          path: |
            dist/app-store-preflight-audit.zip
            dist/app-store-preflight-audit.zip.sha256
            dist/app-store-preflight-audit.provenance.json
            dist/app_store_preflight_audit-*.whl
          if-no-files-found: error
