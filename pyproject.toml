[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "app-store-preflight-audit"
version = "0.3.0b1"
description = "Evidence-driven, read-only App Store submission preflight scanner and Codex Skill"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = []
keywords = ["app-store", "ios", "xcode", "privacy-manifest", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
app-store-preflight-audit = "app_store_preflight_audit.scripts.cli:main"

[tool.setuptools]
package-dir = {app_store_preflight_audit = "skill/app-store-preflight-audit"}
packages = ["app_store_preflight_audit", "app_store_preflight_audit.scripts"]

[tool.setuptools.package-data]
app_store_preflight_audit = [
  "SKILL.md",
  "agents/*.yaml",
  "references/*.md",
  "references/*.json",
  "references/schemas/*.json",
]
